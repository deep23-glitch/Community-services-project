<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLedger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- STEP 6 - Page shell. JavaScript fills #nav and #view; modals go in #modal. -->
  <div class="app">
    <aside class="side">
      <div class="brand"><span class="logo">S</span><span>ShopLedger</span></div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="shopcard"><b id="shopName">Shop</b><small>Small shop workspace</small></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="crumbs"><span id="crumbShop"></span> /<b id="crumbPage"></b></div>
        <div class="top-right">
          <span class="datepill" id="today"></span>
          <button class="avatar" id="avatar" data-act="settings" aria-label="Shop settings"></button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>
  <div class="overlay" id="modal" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
